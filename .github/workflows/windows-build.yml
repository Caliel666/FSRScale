name: Windows Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + tests (FSR SDK 1.1.4)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AMD FidelityFX SDK 1.1.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/releases/download/v1.1.4/FidelityFX-SDK-v1.1.4.zip"
          $zip = Join-Path $env:RUNNER_TEMP "FidelityFX-SDK-v1.1.4.zip"
          $root = Join-Path $env:RUNNER_TEMP "ffx-sdk"
          New-Item -ItemType Directory -Force $root | Out-Null

          curl.exe -L --fail --retry 5 --retry-delay 3 --output $zip $url
          7z x $zip "-o$root" -y | Out-Host

          $sdk = Get-ChildItem -Path $root -Directory | Where-Object { $_.Name -like "FidelityFX-SDK*" } | Select-Object -First 1
          if (-not $sdk) { $sdk = Get-Item $root }

          $header = Get-ChildItem -Path $sdk.FullName -Recurse -Filter "ffx_api.h" | Where-Object { $_.FullName -match "ffx_api[\\/]ffx_api\.h$" } | Select-Object -First 1
          $dll = Get-ChildItem -Path $sdk.FullName -Recurse -Filter "amd_fidelityfx_dx12.dll" | Select-Object -First 1

          if (-not $header) { throw "FidelityFX SDK header ffx_api/ffx_api.h was not found." }
          if (-not $dll) { throw "FidelityFX SDK runtime amd_fidelityfx_dx12.dll was not found." }

          "FFX_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFX_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "FSR SDK root: $($sdk.FullName)"
          Write-Host "FSR header:   $($header.FullName)"
          Write-Host "FSR runtime:  $($dll.FullName)"

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -A x64 -DFFX_SDK="$env:FFX_SDK" -DBUILD_TESTING=ON

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify runtime was staged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "build/Release/NRLive.exe")) { throw "NRLive.exe was not produced." }
          if (-not (Test-Path "build/Release/amd_fidelityfx_dx12.dll")) { throw "amd_fidelityfx_dx12.dll was not staged beside NRLive.exe." }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NRLive-windows-x64
          path: |
            build/Release/NRLive.exe
            build/Release/amd_fidelityfx_dx12.dll